<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Mein Trainingsplan</title>
  <style>
    :root{--bg:#f4f5f7;--card:#fff;--text:#17202a;--muted:#6b7280;--line:#e5e7eb;--blue:#2563eb;--green:#22c55e;--red:#ef4444;--yellow:#eab308}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    header{position:sticky;top:0;z-index:5;background:#111827;color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px}
    header h1{font-size:21px;margin:0 0 10px} select,button,input,textarea{font:inherit}
    select,input,textarea{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff}
    header select{width:100%;background:#1f2937;color:#fff;border-color:#374151}
    main{padding:14px 14px 100px;max-width:800px;margin:auto}
    .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
    button{border:0;border-radius:12px;padding:10px 13px;background:#fff;box-shadow:0 1px 3px #0001}
    button.primary{background:var(--blue);color:#fff}.danger{color:#b91c1c}
    .week{margin:18px 0 8px;font-weight:700;font-size:18px}
    .session{background:var(--card);border:1px solid var(--line);border-left:7px solid #cbd5e1;border-radius:14px;padding:12px;margin:8px 0;box-shadow:0 1px 2px #0000000a}
    .session.done{border-left-color:var(--green)} .session.cancel{border-left-color:var(--red)} .session.move{border-left-color:var(--yellow)}
    .top{display:flex;justify-content:space-between;gap:10px}.title{font-weight:700}.date{color:var(--muted);font-size:13px}
    .meta{font-size:14px;color:#4b5563;margin:5px 0}.note{background:#f9fafb;border-radius:10px;padding:8px;margin-top:8px;font-size:14px;white-space:pre-wrap}
    .actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.actions button{padding:7px 9px;font-size:13px}
    .legend{display:flex;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin:8px 0 14px}
    .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}.g{background:var(--green)}.r{background:var(--red)}.y{background:var(--yellow)}.n{background:#cbd5e1}
    .empty{text-align:center;padding:35px;color:var(--muted)}
    dialog{border:0;border-radius:18px;padding:0;width:min(94vw,620px);box-shadow:0 20px 60px #0004}
    dialog::backdrop{background:#0006}.modal{padding:18px}.modal h2{margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}
    label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600}.modal .buttons{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}.stat{background:#fff;border-radius:14px;padding:12px;text-align:center}.stat b{font-size:22px;display:block}
    @media(max-width:520px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
  </style>
</head>
<body>
<header>
  <h1>🚴 Mein Trainingsplan</h1>
  <select id="planSelect"></select>
</header>
<main>
  <div class="stats" id="stats"></div>
  <div class="toolbar">
    <button class="primary" onclick="openSession()">＋ Training</button>
    <button onclick="openPlan()">＋ Trainingsplan</button>
    <button onclick="exportData()">⇩ Backup</button>
    <button onclick="document.getElementById('importFile').click()">⇧ Import</button>
    <input id="importFile" type="file" accept=".json" hidden onchange="importData(event)">
  </div>
  <div class="legend">
    <span><i class="dot g"></i>durchgeführt</span>
    <span><i class="dot r"></i>abgesagt/nicht durchgeführt</span>
    <span><i class="dot y"></i>verschoben</span>
    <span><i class="dot n"></i>offen</span>
  </div>
  <div id="list"></div>
</main>

<dialog id="sessionDialog">
  <form method="dialog" class="modal" onsubmit="saveSession(event)">
    <h2 id="sessionHeading">Training</h2>
    <div class="grid">
      <label>Datum<input id="sDate" type="date" required></label>
      <label>Trainingsart<input id="sType" list="types" placeholder="z. B. Indoor, Outdoor, Kraft"></label>
      <label class="full">Titel<input id="sTitle" required placeholder="z. B. Grundlagenausdauer"></label>
      <label class="full">Beschreibung<textarea id="sDesc" rows="3" placeholder="Dauer, Intensität, Ziel, Vorgaben …"></textarea></label>
      <label>Plan<input id="sPlan" type="text" readonly></label>
      <label>Status<select id="sStatus"><option value="open">Offen</option><option value="done">Durchgeführt</option><option value="cancel">Abgesagt / nicht durchgeführt</option><option value="move">Verschoben</option></select></label>
      <label class="full">Meine Anmerkung<textarea id="sNote" rows="3" placeholder="Wie war es? Leistung, Puls, Beine, Probleme …"></textarea></label>
    </div>
    <div class="buttons"><button type="button" onclick="sessionDialog.close()">Abbrechen</button><button class="primary">Speichern</button></div>
  </form>
</dialog>

<dialog id="planDialog">
  <form method="dialog" class="modal" onsubmit="savePlan(event)">
    <h2>Neuen Trainingsplan anlegen</h2>
    <div class="grid">
      <label class="full">Name<input id="pName" required placeholder="z. B. Radmarathon Juni 2027"></label>
      <label class="full">Beschreibung<textarea id="pDesc" rows="3" placeholder="Ziel, Zeitraum, Besonderheiten …"></textarea></label>
    </div>
    <div class="buttons"><button type="button" onclick="planDialog.close()">Abbrechen</button><button class="primary">Anlegen</button></div>
  </form>
</dialog>

<datalist id="types">
  <option>Indoor Rad</option><option>Outdoor Rad</option><option>Grundlage</option><option>Intervalle</option>
  <option>Regeneration</option><option>Kraft / BetterMe</option><option>Mobilität</option><option>Sonstiges</option>
</datalist>

<script>

 "planId": "RADMARATHON", "date": "2026-09-11", "type": "Indoor Rad", "title": "Intervalle", "desc": "ca. 60 min · Kurze kontrollierte Intervalle, keine Maximalbelastung.", "note": "", "status": "open"}, {"id": "5434eff2-dbba-41e6-8499-325e740770fd", "planId": "RADMARATHON", "date": "2026-09-12", "type": "Outdoor Rad", "title": "Grundlagenausfahrt", "desc": "50–60 km · 50–60 km; überwiegend Z2, Anstiege kontrolliert fahren.", "note": "", "status": "open"}, {"id": "fe5505a8-149e-49ca-a0ae-cbddf05a6d1f", "planId": "RADMARATHON", "date": "2026-09-13", "type": "Regeneration", "title": "Ruhetag", "desc": "— · Erholung.", "note": "", "status": "open"}, {"id": "a5fe7374-f10c-46d5-88db-0bd5c479cb45", "planId": "RADMARATHON", "date": "2026-09-14", "type": "Indoor Rad", "title": "Grundlage", "desc": "60 min Z2 · Ausdauerarbeit.", "note": "", "status": "open"}, {"id": "2146ce9a-be52-4697-b6b9-e3dfa5660938", "planId": "RADMARATHON", "date": "2026-09-15", "type": "Kraft / BetterMe", "title": "BetterMe", "desc": "20–30 min · Moderate Kraft-/Core-Einheit.", "note": "", "status": "open"}, {"id": "24dde07d-3606-4ccd-a53a-cd70fd1bf046", "planId": "RADMARATHON", "date": "2026-09-16", "type": "Indoor Rad", "title": "Schwelle / Tempo", "desc": "60–70 min · Belastungsblöcke an der oberen Ausdauer-/Tempo-Grenze.", "note": "", "status": "open"}, {"id": "5adf7eee-01bf-4922-925d-e40956abbedf", "planId": "RADMARATHON", "date": "2026-09-17", "type": "Regeneration", "title": "Ruhetag", "desc": "— · Erholung.", "note": "", "status": "open"}, {"id": "3b7fd233-6ce5-4ba6-bca7-74ed5cd97bb5", "planId": "RADMARATHON", "date": "2026-09-18", "type": "Indoor Rad", "title": "Grundlage", "desc": "50–60 min · Lockere bis moderate Ausdauer.", "note": "", "status": "open"}, {"id": "c543c676-fc84-421c-a7cc-8a022af8d68e", "planId": "RADMARATHON", "date": "2026-09-19", "type": "Indoor Rad", "title": "Lange Grundlage", "desc": "75–90 min Z2 · Längere Indoor-Einheit, gleichmäßig.", "note": "", "status": "open"}, { if(!db.activePlan) db.activePlan=db.plans[0].id;
let editId=null;

function save(){localStorage.setItem(KEY,JSON.stringify(db)); render();}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function render(){
  const ps=document.getElementById("planSelect");
  ps.innerHTML=db.plans.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("");
  ps.value=db.activePlan; ps.onchange=()=>{db.activePlan=ps.value;save()};
  const arr=db.sessions.filter(s=>s.planId===db.activePlan).sort((a,b)=>a.date.localeCompare(b.date));
  const done=arr.filter(s=>s.status==="done").length, cancel=arr.filter(s=>s.status==="cancel").length;
  document.getElementById("stats").innerHTML=`<div class="stat"><b>${arr.length}</b>Trainings</div><div class="stat"><b>${done}</b>erledigt</div><div class="stat"><b>${cancel}</b>ausgefallen</div>`;
  const list=document.getElementById("list");
  if(!arr.length){list.innerHTML='<div class="empty">Noch keine Trainings in diesem Plan.<br>Über „＋ Training“ kannst du sie anlegen.</div>';return}
  const groups={};
  arr.forEach(s=>{const d=new Date(s.date+"T12:00:00"), key=`KW ${isoWeek(d)} · ${d.toLocaleDateString("de-DE",{month:"long",year:"numeric"})}`;(groups[key]??=[]).push(s)});
  list.innerHTML=Object.entries(groups).map(([w,items])=>`<div class="week">${w}</div>`+items.map(card).join("")).join("");
}
function card(s){
  const d=new Date(s.date+"T12:00:00");
  return `<div class="session ${s.status}">
    <div class="top"><div class="title">${esc(s.title)}</div><div class="date">${d.toLocaleDateString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit"})}</div></div>
    <div class="meta">${esc(s.type||"")} ${s.desc?"· "+esc(s.desc):""}</div>
    ${s.note?`<div class="note">📝 ${esc(s.note)}</div>`:""}
    <div class="actions">
      <button onclick="status('${s.id}','done')">🟢 Erledigt</button>
      <button onclick="status('${s.id}','move')">🟡 Verschoben</button>
      <button onclick="status('${s.id}','cancel')">🔴 Ausgefallen</button>
      <button onclick="status('${s.id}','open')">⚪ Offen</button>
      <button onclick="openSession('${s.id}')">✏️ Bearbeiten</button>
    </div>
  </div>`;
}
function status(id,st){const s=db.sessions.find(x=>x.id===id);s.status=st;save();}
function openSession(id=null){
  editId=id; const s=id?db.sessions.find(x=>x.id===id):null;
  document.getElementById("sessionHeading").textContent=s?"Training bearbeiten":"Training hinzufügen";
  sDate.value=s?.date||new Date().toISOString().slice(0,10); sType.value=s?.type||"";
  sTitle.value=s?.title||""; sDesc.value=s?.desc||""; sNote.value=s?.note||"";
  sStatus.value=s?.status||"open"; sPlan.value=db.plans.find(p=>p.id===db.activePlan)?.name||"";
  sessionDialog.showModal();
}
function saveSession(e){
  e.preventDefault();
  const obj={id:editId||crypto.randomUUID(),planId:db.activePlan,date:sDate.value,type:sType.value,title:sTitle.value,desc:sDesc.value,note:sNote.value,status:sStatus.value};
  const i=db.sessions.findIndex(x=>x.id===obj.id); if(i>=0) db.sessions[i]=obj; else db.sessions.push(obj);
  sessionDialog.close();save();
}
function openPlan(){pName.value="";pDesc.value="";planDialog.showModal();}
function savePlan(e){
  e.preventDefault(); const p={id:crypto.randomUUID(),name:pName.value,description:pDesc.value};
  db.plans.push(p);db.activePlan=p.id;planDialog.close();save();
}
function exportData(){
  const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"}),a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download="trainingsplan-backup.json";a.click();URL.revokeObjectURL(a.href);
}
function importData(e){
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.plans||!x.sessions)throw 0;db=x;save();alert("Backup importiert.");}catch{alert("Ungültige Backup-Datei.");}};
  r.readAsText(f);e.target.value="";
}
function isoWeek(d){const x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=x.getUTCDay()||7;x.setUTCDate(x.getUTCDate()+4-day);const y=new Date(Date.UTC(x.getUTCFullYear(),0,1));return Math.ceil((((x-y)/86400000)+1)/7)}
render();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
