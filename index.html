<title>Training v5.5</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#eef0f4;--text:#1c1c1e;--muted:#76767d;--glass:rgba(255,255,255,.34);
  --glass2:rgba(255,255,255,.48);--border:rgba(255,255,255,.48);--shadow:0 16px 42px rgba(20,22,28,.10);
  --green:#34c759;--red:#ff453a;--yellow:#d6a200;--gold:#c99700;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  margin:0;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  background:
    radial-gradient(circle at 10% 5%,rgba(255,255,255,.58),transparent 28%),
    radial-gradient(circle at 88% 16%,rgba(210,214,222,.28),transparent 28%),
    linear-gradient(180deg,#f4f5f7,#e9ebef);
  min-height:100vh;overflow-x:hidden;
}
button,input,textarea,select{font:inherit} input,textarea,select{font-size:16px}
button{cursor:pointer}
.shell{min-height:100vh;padding-bottom:104px}
main{max-width:1120px;margin:auto;padding:24px 16px 36px}
.glass{
  background:var(--glass);border:1px solid var(--border);box-shadow:var(--shadow),inset 0 1px rgba(255,255,255,.55);
  backdrop-filter:blur(32px) saturate(145%);-webkit-backdrop-filter:blur(32px) saturate(145%);
}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:4px 0 18px}
.page-title{font-size:32px;font-weight:760;letter-spacing:-.7px}.cloud{font-size:12px;color:var(--muted);text-align:right}
.event-grid{display:grid;grid-template-columns:1fr;gap:14px}
.event-card{border-radius:22px;padding:20px;min-height:128px;display:flex;flex-direction:column;justify-content:space-between}
.event-card h2{font-size:20px;line-height:1.2;margin:0 0 8px}.event-card p{margin:0;color:var(--muted);font-size:13px}
.event-card .foot{display:flex;justify-content:space-between;align-items:end;margin-top:20px}
.event-card .blocks{font-size:12px;color:var(--muted)} .chev{font-size:24px}
.plan-head{border-radius:22px;padding:18px;margin-bottom:14px}
.plan-event{font-weight:720;font-size:18px;margin-bottom:10px}
.plan-controls{display:flex;gap:10px;flex-wrap:wrap}
select,input,textarea{border:1px solid var(--border);background:rgba(255,255,255,.42);color:var(--text);border-radius:13px;padding:11px 12px;outline:0}
.segment{display:flex;gap:2px;padding:3px;border-radius:12px;background:rgba(118,118,128,.11);width:max-content}
.segment button{border:0;background:transparent;color:var(--muted);padding:8px 13px;border-radius:9px}
.segment button.active{background:rgba(255,255,255,.55);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.07)}
.actions-top{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.pill{border:1px solid var(--border);background:var(--glass);color:var(--text);border-radius:14px;padding:10px 13px;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
.pill.primary{background:rgba(70,72,76,.86);color:#fff}.pill.gold{background:rgba(255,242,174,.50);color:#715500}
.week-title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.35px;margin:22px 4px 8px}
.session{position:relative;border-radius:19px;padding:15px 15px 13px 19px;margin:8px 0}
.session:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:#c7c7cc}
.session.done:before{background:var(--green)}.session.cancel:before{background:var(--red)}.session.move:before{background:var(--yellow)}
.session.topup{outline:1px solid rgba(201,151,0,.40);background:rgba(255,248,214,.34)}
.session.topup:before{background:var(--gold)}
.badge{display:inline-block;font-size:10px;font-weight:750;border-radius:8px;padding:3px 7px;margin-bottom:7px;background:rgba(255,239,159,.55);color:#755700}
.row{display:flex;justify-content:space-between;gap:10px}.stitle{font-weight:690}.sdate{font-size:12px;color:var(--muted);white-space:nowrap}
.meta{font-size:13px;color:var(--muted);margin-top:5px;line-height:1.35}.note{margin-top:9px;padding:9px;border-radius:11px;background:rgba(255,255,255,.24);font-size:13px}
.sactions{display:flex;gap:10px;flex-wrap:wrap;border-top:1px solid rgba(127,127,127,.10);padding-top:10px;margin-top:11px}
.sactions button{border:0;background:transparent;padding:2px;color:var(--muted);font-size:12px}.sactions .ok{color:var(--green)}.sactions .bad{color:var(--red)}.sactions .warn{color:#9a7200}
.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.day{border-radius:15px;padding:8px;min-height:84px}
.day.today{outline:2px solid rgba(100,100,105,.48)}.daynum{font-size:11px;font-weight:700}
.dayitem{font-size:9px;margin-top:5px;padding:5px;border-radius:7px;background:rgba(255,255,255,.30);overflow:hidden}.dayitem.topup{background:rgba(255,239,159,.35)}
.settings-card{border-radius:20px;padding:17px;margin:10px 0}.settings-card h3{margin:0 0 5px}.settings-card p{color:var(--muted);font-size:13px;line-height:1.45}
.empty{text-align:center;color:var(--muted);padding:50px}
.nav{
  position:fixed;z-index:50;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);
  display:flex;gap:8px;pointer-events:none
}
.nav button{
  pointer-events:auto;border:1px solid var(--border);background:rgba(245,245,247,.42);color:var(--muted);
  width:68px;height:58px;border-radius:18px;box-shadow:0 10px 28px rgba(0,0,0,.10),inset 0 1px rgba(255,255,255,.58);
  backdrop-filter:blur(30px) saturate(150%);-webkit-backdrop-filter:blur(30px) saturate(150%);
  font-size:10px
}
.nav button span{display:block;font-size:20px;line-height:22px}.nav button.active{color:var(--text);background:rgba(255,255,255,.54)}
dialog{border:0;padding:0;background:transparent;width:min(94vw,620px);max-height:88dvh}
dialog::backdrop{background:rgba(10,10,12,.22);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.modal{border-radius:24px;padding:20px;max-height:88dvh;overflow:auto}.modal h2{margin:0 0 8px}.helper{font-size:13px;color:var(--muted);margin:0 0 16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}label{font-size:12px;color:var(--muted);font-weight:650;display:flex;flex-direction:column;gap:6px}
.inline{flex-direction:row;align-items:center;background:rgba(255,246,195,.30);padding:10px;border-radius:12px}.inline input{width:18px;height:18px}
.buttons{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:18px}.buttons button{border:0;border-radius:12px;padding:10px 13px}.buttons .primary{background:#55575c;color:#fff}
@media(min-width:768px) and (max-width:1199px){main{padding:28px 28px 40px}.event-grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1200px){
  .shell{padding:0 0 0 126px}.nav{left:18px;top:50%;bottom:auto;transform:translateY(-50%);flex-direction:column}
  .nav button{width:88px;height:68px}.event-grid{grid-template-columns:repeat(2,1fr)} main{padding:34px 40px 48px}
}
@media(prefers-color-scheme:dark){
  :root{--text:#f3f3f5;--muted:#aaaab0;--glass:rgba(42,43,47,.30);--glass2:rgba(48,49,53,.42);--border:rgba(255,255,255,.10);--shadow:0 18px 44px rgba(0,0,0,.28)}
  body{background:radial-gradient(circle at 15% 7%,rgba(255,255,255,.04),transparent 28%),linear-gradient(180deg,#131416,#0b0c0e)}
  select,input,textarea{background:rgba(56,57,61,.42)}.segment button.active,.nav button.active{background:rgba(78,79,84,.50)}
  .nav button{background:rgba(32,33,36,.44)}.session.topup{background:rgba(90,72,15,.20)}.modal{background:rgba(30,31,34,.72)}
}

/* ===== V5.3 definitive UI overrides ===== */
.event-card h2{font-size:23px!important;font-weight:800!important;letter-spacing:-.4px!important;margin:0 0 5px!important}
.event-card .event-sub{display:block!important;font-size:13px!important;line-height:1.35!important;color:var(--muted)!important;margin-top:2px!important}
.session{border-radius:24px!important;overflow:hidden!important}
.session::before{width:10px!important;border-radius:24px 0 0 24px!important}
.session.done{background:rgba(52,199,89,.075)!important}
.session.cancel{background:rgba(255,69,58,.065)!important}
.session.move{background:rgba(214,162,0,.070)!important}
.session.topup{background:rgba(201,151,0,.070)!important}
.calendar{grid-template-columns:repeat(7,minmax(0,1fr))!important;gap:7px!important}
.day{min-width:0!important;overflow:hidden!important}
.dayitem{font-size:9px!important;line-height:1.18!important;padding:5px 4px!important;white-space:normal!important;word-break:normal!important;overflow-wrap:anywhere!important;hyphens:auto!important;min-width:0!important}
.daynum{font-size:10px!important;line-height:1.1!important}
.nav{display:flex!important;gap:8px!important;align-items:center!important}
.nav button{width:80px!important;min-width:80px!important;height:64px!important;padding:6px 4px!important;white-space:normal!important;overflow:hidden!important;text-align:center!important;display:flex!important;flex-direction:column!important;justify-content:center!important;align-items:center!important;gap:2px!important;line-height:1.05!important;font-size:10px!important}
.nav button span{display:block!important;font-size:19px!important;line-height:20px!important;margin:0!important}
@media(min-width:1200px){.nav button{width:98px!important;min-width:98px!important;height:72px!important;font-size:11px!important}}
@media(prefers-color-scheme:dark){.session.done{background:rgba(52,199,89,.12)!important}.session.cancel{background:rgba(255,69,58,.10)!important}.session.move{background:rgba(214,162,0,.10)!important}.session.topup{background:rgba(201,151,0,.11)!important}}


/* ===== V5.4 Status Reset + Responsive Details ===== */
dialog#sessionDialog{
  width:min(94vw,760px) !important;
  max-width:760px !important;
  max-height:min(92dvh,900px) !important;
  margin:auto !important;
}
#sessionDialog .modal{
  width:100% !important;
  max-height:min(92dvh,900px) !important;
  overflow:auto !important;
  -webkit-overflow-scrolling:touch;
  padding:22px !important;
}
#sessionDialog .grid{grid-template-columns:repeat(2,minmax(0,1fr)) !important}
.session{touch-action:pan-y}
.action-sheet{
  position:fixed;z-index:120;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));
  transform:translateX(-50%);
  width:min(92vw,420px);padding:10px;border-radius:22px
}
.action-sheet h3{margin:6px 8px 10px;font-size:15px}
.action-sheet button{
  width:100%;border:0;border-radius:14px;padding:13px;margin:4px 0;
  background:rgba(255,255,255,.40);color:var(--text)
}
.action-sheet button.danger{color:var(--red)}
.action-sheet button.neutral{color:var(--muted)}
.action-sheet-backdrop{
  position:fixed;z-index:119;inset:0;background:rgba(0,0,0,.15);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)
}
@media(max-width:767px){
  dialog#sessionDialog{
    width:calc(100vw - 12px) !important;
    max-width:none !important;
    max-height:calc(100dvh - 12px - env(safe-area-inset-top) - env(safe-area-inset-bottom)) !important
  }
  #sessionDialog .modal{
    max-height:calc(100dvh - 12px - env(safe-area-inset-top) - env(safe-area-inset-bottom)) !important;
    padding:16px !important;border-radius:24px !important
  }
  #sessionDialog .grid{grid-template-columns:1fr !important;gap:10px !important}
}
@media(min-width:768px) and (max-width:1199px){
  dialog#sessionDialog{width:min(90vw,700px) !important}
}


/* ===== V5.5 Week status colors ===== */
.dayitem.open{
  background:rgba(160,160,165,.12) !important;
  border:1px solid rgba(160,160,165,.14) !important;
}
.dayitem.done{
  background:rgba(52,199,89,.14) !important;
  border:1px solid rgba(52,199,89,.18) !important;
}
.dayitem.move{
  background:rgba(214,162,0,.14) !important;
  border:1px solid rgba(214,162,0,.18) !important;
}
.dayitem.cancel{
  background:rgba(255,69,58,.13) !important;
  border:1px solid rgba(255,69,58,.17) !important;
}
.dayitem.topup{
  box-shadow:inset 0 0 0 1px rgba(201,151,0,.22);
}
.dayitem.done.topup{
  background:
    linear-gradient(180deg,rgba(255,239,159,.18),rgba(52,199,89,.12)) !important;
}
.dayitem.move.topup{
  background:
    linear-gradient(180deg,rgba(255,239,159,.20),rgba(214,162,0,.12)) !important;
}
.dayitem.cancel.topup{
  background:
    linear-gradient(180deg,rgba(255,239,159,.18),rgba(255,69,58,.11)) !important;
}
@media(prefers-color-scheme:dark){
  .dayitem.open{background:rgba(160,160,165,.16) !important}
  .dayitem.done{background:rgba(52,199,89,.20) !important}
  .dayitem.move{background:rgba(214,162,0,.19) !important}
  .dayitem.cancel{background:rgba(255,69,58,.18) !important}
}

<body>
<div class="shell"><main id="main"></main></div>

<nav class="nav">
<button id="navOverview" class="active" onclick="go('overview')"><span>⌂</span>Übersicht</button>
<button id="navPlan" onclick="go('plan')"><span>▤</span>Plan</button>
<button onclick="openSession()"><span>＋</span>Training</button>
<button id="navSettings" onclick="go('settings')"><span>⚙︎</span>Einstellungen</button>
</nav>

<dialog id="sessionDialog"><form class="modal glass" onsubmit="saveSession(event)">
<h2 id="sessionHeading" tabindex="-1">Training</h2><p class="helper">Datum und Uhrzeit werden für neue Einheiten automatisch auf jetzt gesetzt.</p>
<div class="grid">
<label>Datum & Uhrzeit<input id="sDateTime" type="datetime-local" required></label>
<label>Trainingsart<select id="sType"><option>Indoor Rad</option><option>Outdoor Rad</option><option>Kraft / BetterMe</option><option>Regeneration</option><option>Laufen</option><option>Schwimmen</option><option>Ski / Skitour</option><option>Mobilität</option><option>Sonstiges</option></select></label>
<label class="full">Titel<input id="sTitle" required></label>
<label class="full">Beschreibung<textarea id="sDesc" rows="3"></textarea></label>
<label>Status<select id="sStatus"><option value="open">Offen</option><option value="done">Durchgeführt</option><option value="cancel">Ausgefallen</option><option value="move">Verschoben</option></select></label>
<label>Erinnerung<select id="sReminder"><option value="both">Vortag + Trainingstag</option><option value="day">Nur Trainingstag</option><option value="before">Nur Vortag</option><option value="none">Keine</option></select></label>
<label>Erinnerungszeit<input id="sReminderTime" type="time" value="19:00"></label>
<label class="full inline"><input id="sTopup" type="checkbox"> ⭐ On-Top-Zusatztraining</label>
<label class="full">Notiz<textarea id="sNote" rows="3"></textarea></label>
</div><div class="buttons"><button type="button" onclick="sessionDialog.close()">Abbrechen</button><button class="primary">Speichern</button></div>
</form></dialog>

<dialog id="loginDialog"><form class="modal glass" onsubmit="login(event)">
<h2>Cloud anmelden</h2><p class="helper">E-Mail + Passwort. Die Session bleibt auf Wunsch auf diesem Gerät gespeichert.</p>
<div class="grid">
<label class="full">E-Mail<input id="loginEmail" type="email" required autocomplete="email"></label>
<label class="full">Passwort<input id="loginPassword" type="password" required autocomplete="current-password"></label>
<label class="full inline"><input id="rememberLogin" type="checkbox" checked> Angemeldet bleiben</label>
</div><div id="loginStatus" class="helper"></div>
<div class="buttons"><button type="button" onclick="passwordReset()">Passwort vergessen</button><button type="button" onclick="loginDialog.close()">Abbrechen</button><button class="primary">Anmelden</button></div>
</form></dialog>

function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function nowLocal(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)}
function isoWeek(d){const x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=x.getUTCDay()||7;x.setUTCDate(x.getUTCDate()+4-day);const y=new Date(Date.UTC(x.getUTCFullYear(),0,1));return Math.ceil((((x-y)/86400000)+1)/7)}
function isUuid(v){return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(String(v||""))}
function activeEvent(){return db.events.find(e=>e.id===db.activeEvent)||db.events[0]}
function activePlan(){return db.plans.find(p=>p.id===db.activePlan)||db.plans.find(p=>p.eventId===db.activeEvent)}
function unitEmoji(s){const t=((s.type||"")+" "+(s.title||"")).toLowerCase();if(/betterme|kraft|core|calis/.test(t))return"💪";if(/ruhe|regeneration|erholung|urlaub/.test(t))return"😴";if(/mobil/.test(t))return"🧘";if(/indoor/.test(t)&&/rad|bike/.test(t))return"🚲";if(/outdoor/.test(t)&&/rad|bike/.test(t))return"🚴";if(/rad|bike|rennrad/.test(t))return"🚴";if(/lauf|run/.test(t))return"🏃";if(/schwimm|swim/.test(t))return"🏊";if(/ski/.test(t))return"⛷️";return"🏋️"}

function persist(){localStorage.setItem(KEY,JSON.stringify(db));render();queueSync()}
function go(s){screen=s;document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));if(s==="overview")navOverview.classList.add("active");if(s==="plan")navPlan.classList.add("active");if(s==="settings")navSettings.classList.add("active");render()}
function selectEvent(id){db.activeEvent=id;const p=db.plans.find(x=>x.eventId===id);if(p)db.activePlan=p.id;localStorage.setItem(KEY,JSON.stringify(db));screen="plan";go("plan")}
function selectPlan(id){db.activePlan=id;localStorage.setItem(KEY,JSON.stringify(db));render()}

function render(){if(screen==="overview")renderOverview();else if(screen==="plan")renderPlan();else renderSettings();updateCloud()}
function head(title){return `<div class="page-head"><div class="page-title">${esc(title)}</div><div id="cloudStatus" class="cloud">☁️ Cloud wird geprüft …</div></div>`}

function renderOverview(){
 const cards=db.events.map(e=>{
  const blocks=db.plans.filter(p=>p.eventId===e.id);
  const cleanTitle=String(e.name||"").replace(/^🚴\s*/,"").replace(/\s*[–-]\s*Route Typ C$/i,"");
  const detail=e.description||"Route Typ C";
  return `<article class="event-card glass" onclick="selectEvent('${e.id}')">
    <div>
      <h2>${esc(cleanTitle)}</h2>
      <div class="event-sub">${esc(detail)}</div>
    </div>
    <div class="foot">
      <div class="blocks">${blocks.length} Block${blocks.length===1?"":"e"}</div>
      <div class="chev">›</div>
    </div>
  </article>`;
}).join("");
 main.innerHTML=head("Übersicht")+`<div class="event-grid">${cards||'<div class="empty">Noch keine Events.</div>'}</div>`;
}

function renderPlan(){
 const e=activeEvent(), p=activePlan();if(!e||!p){main.innerHTML=head("Plan")+'<div class="empty">Kein Plan ausgewählt.</div>';return}
 const blocks=db.plans.filter(x=>x.eventId===e.id);
 const controls=`<section class="plan-head glass"><div class="plan-event">${esc(e.name)}</div><div class="plan-controls"><select onchange="selectPlan(this.value)">${blocks.map(b=>`<option value="${b.id}" ${b.id===p.id?"selected":""}>${esc(b.name)}</option>`).join("")}</select><div class="segment"><button class="${planView==="list"?"active":""}" onclick="planView='list';render()">Liste</button><button class="${planView==="week"?"active":""}" onclick="planView='week';render()">Woche</button></div></div></section>
 <div class="actions-top"><button class="pill primary" onclick="openSession()">＋ Training</button><button class="pill gold" onclick="openSession(null,true)">⭐ On Top</button></div>`;
 main.innerHTML=head("Plan")+controls+`<div id="planContent"></div>`;
 if(planView==="list")renderList();else renderWeek();
}

function currentSessions(){return db.sessions.filter(s=>s.planId===db.activePlan).sort((a,b)=>a.date.localeCompare(b.date))}
function renderList(){
 const arr=currentSessions(), root=document.getElementById("planContent");if(!arr.length){root.innerHTML='<div class="empty">Noch keine Einheiten in diesem Block.</div>';return}
 const groups={};arr.forEach(s=>{const d=new Date(s.date+"T12:00:00"),k=`KW ${isoWeek(d)} · ${d.toLocaleDateString("de-DE",{month:"long",year:"numeric"})}`;(groups[k]??=[]).push(s)})
 root.innerHTML=Object.entries(groups).map(([w,items])=>`<div class="week-title">${w}</div>${items.map(card).join("")}`).join("")
}
function card(s){
 const dt=new Date((s.scheduledAt||s.date+"T19:00")+":00");return `<article class="session glass ${s.status} ${s.topup?"topup":""}" data-session-id="${s.id}">${s.topup?'<div class="badge">⭐ ON TOP</div>':""}<div class="row"><div class="stitle">${unitEmoji(s)} ${esc(s.title)}</div><div class="sdate">${dt.toLocaleDateString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit"})} · ${dt.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})}</div></div><div class="meta">${esc(s.type||"")}${s.desc?" · "+esc(s.desc):""}</div>${s.note?`<div class="note">📝 ${esc(s.note)}</div>`:""}<div class="sactions"><button class="ok" onclick="setStatus('${s.id}','done')">Erledigt</button><button class="warn" onclick="setStatus('${s.id}','move')">Verschoben</button><button class="bad" onclick="setStatus('${s.id}','cancel')">Ausgefallen</button><button onclick="setStatus('${s.id}','open')">Neutral</button><button onclick="openSession('${s.id}')">Details</button><button onclick="moveTomorrow('${s.id}')">Morgen</button></div></article>`
}
function renderWeek(){
 const arr=currentSessions(), root=document.getElementById("planContent");if(!arr.length){root.innerHTML='<div class="empty">Noch keine Einheiten in diesem Block.</div>';return}
 const by={};arr.forEach(s=>{const d=new Date(s.date+"T12:00:00"),n=(d.getDay()+6)%7,m=new Date(d);m.setDate(d.getDate()-n);const k=m.toISOString().slice(0,10);(by[k]??=[]).push(s)})
 root.innerHTML=Object.keys(by).sort().map(k=>{const m=new Date(k+"T12:00:00");let days="";for(let i=0;i<7;i++){const d=new Date(m);d.setDate(m.getDate()+i);const ds=d.toISOString().slice(0,10);const items=by[k].filter(x=>x.date===ds);days+=`<div class="day glass ${ds===new Date().toISOString().slice(0,10)?"today":""}"><div class="daynum">${d.toLocaleDateString("de-DE",{weekday:"short",day:"2-digit"})}</div>${items.map(x=>`<div class="dayitem ${x.status||"open"} ${x.topup?"topup":""}" onclick="openSession('${x.id}')">${x.topup?"⭐ ":""}${unitEmoji(x)} ${esc(x.title)}</div>`).join("")}</div>`}return `<div class="week-title">${esc(activePlan().name)} · Woche ab ${m.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"})}</div><div class="calendar">${days}</div>`}).join("")
}

function openSession(id=null,topup=false){
 editId=id;const s=id?db.sessions.find(x=>x.id===id):null;
 sessionHeading.textContent=s?"Training bearbeiten":(topup?"On-Top-Training":"Training hinzufügen");
 sDateTime.value=s?.scheduledAt||nowLocal();sType.value=s?.type||"Indoor Rad";sTitle.value=s?.title||"";sDesc.value=s?.desc||"";sStatus.value=s?.status||"open";sReminder.value=s?.reminder||"both";sReminderTime.value=s?.reminderTime||"19:00";sTopup.checked=!!(s?.topup||topup);sNote.value=s?.note||"";sessionDialog.showModal()
}
function saveSession(e){
 e.preventDefault();const scheduledAt=sDateTime.value||nowLocal(),date=scheduledAt.slice(0,10);
 const obj={id:editId||crypto.randomUUID(),planId:db.activePlan,date,scheduledAt,type:sType.value,title:sTitle.value,desc:sDesc.value,note:sNote.value,status:sStatus.value,topup:sTopup.checked,reminder:sReminder.value,reminderTime:sReminderTime.value,updatedAt:new Date().toISOString()};
 const i=db.sessions.findIndex(x=>x.id===obj.id);if(i>=0)db.sessions[i]=obj;else db.sessions.push(obj);sessionDialog.close();persist()
}
function setStatus(id,status){const s=db.sessions.find(x=>x.id===id);if(!s)return;s.status=status;s.updatedAt=new Date().toISOString();persist()}
function moveTomorrow(id){const s=db.sessions.find(x=>x.id===id);if(!s)return;const d=new Date((s.scheduledAt||s.date+"T19:00")+":00");d.setDate(d.getDate()+1);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());s.scheduledAt=d.toISOString().slice(0,16);s.date=s.scheduledAt.slice(0,10);s.status="move";s.updatedAt=new Date().toISOString();persist()}

function renderSettings(){
 main.innerHTML=head("Einstellungen")+`<section class="settings-card glass"><h3>☁️ Cloud</h3><p id="settingsCloud">Status wird geprüft …</p>${cloudUser?'<button class="pill" onclick="syncCloud(true)">Jetzt synchronisieren</button> <button class="pill" onclick="logout()">Abmelden</button>':'<button class="pill primary" onclick="loginDialog.showModal()">Mit E-Mail + Passwort anmelden</button>'}</section><section class="settings-card glass"><h3>🔄 Automatische Synchronisierung</h3><p>Beim Start, beim Zurückkehren zur App, nach Änderungen und sobald wieder Internet verfügbar ist.</p></section><section class="settings-card glass"><h3>💾 Backup</h3><p>Lokale Sicherung zusätzlich zur Cloud.</p><button class="pill" onclick="exportBackup()">Backup exportieren</button></section>`
}

function updateCloud(){
 const text=!navigator.onLine?"⚠️ Offline":syncing?"☁️ Synchronisierung …":cloudUser?(lastSync?`☁️ Synchronisiert · ${new Date(lastSync).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})}`:`☁️ Verbunden`):"☁️ Nicht angemeldet";
 const el=document.getElementById("cloudStatus");if(el)el.textContent=text;const se=document.getElementById("settingsCloud");if(se)se.textContent=text
}
function exportBackup(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:"application/json"}));a.download="mein-training-backup.json";a.click();URL.revokeObjectURL(a.href)}

function packDesc(s){return "__MT__"+JSON.stringify({desc:s.desc||"",scheduledAt:s.scheduledAt||s.date+"T19:00"})}
function unpackDesc(v){if(String(v||"").startsWith("__MT__")){try{return JSON.parse(String(v).slice(6))}catch{}}return{desc:v||"",scheduledAt:null}}
function planRemote(p){return{id:p.id,user_id:cloudUser.id,name:p.name,description:"__MTP__"+JSON.stringify({eventId:p.eventId,focus:p.focus||"",description:p.description||"",eventName:db.events.find(e=>e.id===p.eventId)?.name||""})}}
function planLocal(r){let meta={};if(String(r.description||"").startsWith("__MTP__"))try{meta=JSON.parse(String(r.description).slice(7))}catch{};if(meta.eventId&&!db.events.some(e=>e.id===meta.eventId))db.events.push({id:meta.eventId,name:meta.eventName||"Event",description:""});return{id:r.id,eventId:meta.eventId||db.activeEvent,name:r.name,focus:meta.focus||"",description:meta.description||""}}
function sessionRemote(s){return{id:s.id,user_id:cloudUser.id,plan_id:s.planId,training_date:s.date,training_type:s.type||"",title:s.title||"",description:packDesc(s),note:s.note||"",status:s.status||"open",topup:!!s.topup,reminder:s.reminder||"both",reminder_time:s.reminderTime||"19:00",updated_at:s.updatedAt||"2026-08-17T00:00:00.000Z"}}
function sessionLocal(r){const d=unpackDesc(r.description);return{id:r.id,planId:r.plan_id,date:r.training_date,scheduledAt:d.scheduledAt||r.training_date+"T19:00",type:r.training_type||"",title:r.title||"",desc:d.desc||"",note:r.note||"",status:r.status||"open",topup:!!r.topup,reminder:r.reminder||"both",reminderTime:String(r.reminder_time||"19:00").slice(0,5),updatedAt:r.updated_at||"2026-08-17T00:00:00.000Z"}}

function makeClient(){
 const remember=localStorage.getItem("mt_remember")!=="false",store=remember?localStorage:sessionStorage;
 return window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:{getItem:k=>store.getItem(k),setItem:(k,v)=>store.setItem(k,v),removeItem:k=>store.removeItem(k)},storageKey:"mt-auth-v51"}})
}

async function login(e){
 e.preventDefault();loginStatus.textContent="Anmeldung …";localStorage.setItem("mt_remember",String(rememberLogin.checked));sb=makeClient();
 const {data,error}=await sb.auth.signInWithPassword({email:loginEmail.value.trim(),password:loginPassword.value});if(error){loginStatus.textContent=error.message;return}
 cloudUser=data.session?.user||data.user;loginDialog.close();await syncCloud(false);render()
}

async function logout(){await sb.auth.signOut();cloudUser=null;render()}

function migrateLocalPlanIds(){
 if(!cloudUser)return;
 const p=db.plans.find(x=>x.id===LOCAL_BLOCK_ID);
 if(p){const old=p.id;p.id=cloudUser.id;db.sessions.forEach(s=>{if(s.planId===old)s.planId=p.id});if(db.activePlan===old)db.activePlan=p.id;localStorage.setItem(KEY,JSON.stringify(db))}
}
async function syncCloud(show=false){
 if(syncing||!cloudUser||!navigator.onLine)return;syncing=true;updateCloud();
 try{
  migrateLocalPlanIds();
  const [pr,sr]=await Promise.all([sb.from("training_plans").select("*"),sb.from("training_sessions").select("*")]);if(pr.error)throw pr.error;if(sr.error)throw sr.error;
  (pr.data||[]).forEach(r=>{if(!db.plans.some(p=>p.id===r.id))db.plans.push(planLocal(r))});
  if(db.plans.length){const {error}=await sb.from("training_plans").upsert(db.plans.map(planRemote),{onConflict:"id"});if(error)throw error}
  const remoteMap=new Map((sr.data||[]).map(r=>[r.id,r])),push=[];
  (sr.data||[]).forEach(r=>{const i=db.sessions.findIndex(s=>s.id===r.id);if(i<0)db.sessions.push(sessionLocal(r));else{const lt=Date.parse(db.sessions[i].updatedAt||0),rt=Date.parse(r.updated_at||0);if(rt>lt)db.sessions[i]=sessionLocal(r);else if(lt>rt)push.push(db.sessions[i])}});
  db.sessions.forEach(s=>{if(!remoteMap.has(s.id))push.push(s)});
  const unique=[...new Map(push.map(s=>[s.id,s])).values()];if(unique.length){const {error}=await sb.from("training_sessions").upsert(unique.map(sessionRemote),{onConflict:"id"});if(error)throw error}
  localStorage.setItem(KEY,JSON.stringify(db));lastSync=new Date().toISOString();localStorage.setItem("mt_last_sync",lastSync);if(show)alert("Synchronisierung abgeschlossen.")
 }catch(e){console.error("Sync",e);if(show)alert("Sync fehlgeschlagen: "+e.message)}
 finally{syncing=false;render()}
}
let syncTimer;function queueSync(){if(!cloudUser)return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>syncCloud(false),700)}
window.addEventListener("online",()=>syncCloud(false));document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")syncCloud(false)});
render();initCloud();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});

/* ===== V5.3 password recovery fix ===== */
async function handleRecoverySession(event,session){
  if(event==="PASSWORD_RECOVERY"){
    cloudUser=session?.user||cloudUser;
    const dlg=document.getElementById("passwordDialog");
    if(dlg && !dlg.open) dlg.showModal();
  }
}
async function saveNewPassword(e){
  e.preventDefault();
  const p1=document.getElementById("newPassword").value;
  const p2=document.getElementById("newPassword2").value;
  const status=document.getElementById("passwordStatus");
  if(p1.length<8){status.textContent="Bitte mindestens 8 Zeichen verwenden.";return}
  if(p1!==p2){status.textContent="Die Passwörter stimmen nicht überein.";return}
  status.textContent="Passwort wird gespeichert …";
  try{
    const {error}=await sb.auth.updateUser({password:p1});
    if(error) throw error;
    status.textContent="Passwort wurde gespeichert.";
    setTimeout(()=>passwordDialog.close(),500);
  }catch(err){
    status.textContent="Fehler: "+(err?.message||err);
  }
}
async function initCloud(){
  try{
    sb=makeClient();
    sb.auth.onAuthStateChange((event,session)=>{
      cloudUser=session?.user||null;
      setTimeout(async()=>{
        await handleRecoverySession(event,session);
        if(cloudUser && event!=="PASSWORD_RECOVERY"){
          try{await syncCloud(false)}catch(e){console.error(e)}
        }
        render();
      },0);
    });
    const {data,error}=await sb.auth.getSession();
    if(error) console.error(error);
    cloudUser=data?.session?.user||null;
    const u=location.href;
    if(cloudUser && /type=recovery/i.test(u)){
      setTimeout(()=>handleRecoverySession("PASSWORD_RECOVERY",data.session),80);
    }else if(cloudUser){
      await syncCloud(false);
    }
    render();
  }catch(e){
    console.error("Cloud init",e);
    render();
  }
}
async function passwordReset(){
  const email=loginEmail.value.trim();
  if(!email){loginStatus.textContent="Bitte E-Mail eingeben.";return}
  const redirectTo=location.origin+location.pathname;
  const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo});
  loginStatus.textContent=error?error.message:"Recovery-Mail gesendet. Öffne den Link; danach erscheint automatisch das Formular für ein neues Passwort.";
}

/* ===== V5.4 gestures / status reset / details focus fix ===== */
function neutralizeSession(id){
  const s=db.sessions.find(x=>x.id===id);
  if(!s)return;
  s.status="open";
  s.updatedAt=new Date().toISOString();
  persist();
}
function deleteSession(id){
  const s=db.sessions.find(x=>x.id===id);
  if(!s)return;
  if(!confirm(`Training "${s.title}" wirklich löschen?`)) return;
  db.sessions=db.sessions.filter(x=>x.id!==id);
  persist();
}
function closeActionSheet(){
  document.querySelector(".action-sheet-backdrop")?.remove();
  document.querySelector(".action-sheet")?.remove();
}
function showSessionActions(id){
  closeActionSheet();
  const s=db.sessions.find(x=>x.id===id);
  if(!s)return;
  const back=document.createElement("div");
  back.className="action-sheet-backdrop";
  back.onclick=closeActionSheet;
  const sheet=document.createElement("div");
  sheet.className="action-sheet glass";
  sheet.innerHTML=`<h3>${esc(s.title)}</h3>
    <button class="neutral" onclick="neutralizeSession('${id}');closeActionSheet()">○ Neutralisieren</button>
    <button class="danger" onclick="deleteSession('${id}');closeActionSheet()">🗑 Löschen</button>
    <button onclick="closeActionSheet()">Abbrechen</button>`;
  document.body.append(back,sheet);
}
function bindSessionGestures(){
  document.querySelectorAll(".session[data-session-id]").forEach(card=>{
    if(card.dataset.gesturesBound==="1")return;
    card.dataset.gesturesBound="1";
    const id=card.dataset.sessionId;

    card.addEventListener("dblclick",e=>{
      if(e.target.closest("button"))return;
      neutralizeSession(id);
    });

    let lastTap=0,startX=0,startY=0;
    card.addEventListener("touchstart",e=>{
      const t=e.changedTouches[0];
      startX=t.clientX;startY=t.clientY;
      const now=Date.now();
      if(now-lastTap<330){
        e.preventDefault();
        neutralizeSession(id);
        lastTap=0;
      }else lastTap=now;
    },{passive:false});

    card.addEventListener("touchend",e=>{
      const t=e.changedTouches[0];
      const dx=t.clientX-startX,dy=t.clientY-startY;
      if(Math.abs(dx)>70 && Math.abs(dx)>Math.abs(dy)*1.35){
        showSessionActions(id);
      }
    },{passive:true});
  });
}

const __v54RenderBase=render;
render=function(){
  __v54RenderBase();
  setTimeout(bindSessionGestures,0);
};

const __v54OpenSessionBase=openSession;
openSession=function(id=null,topup=false){
  const keepView=planView;
  __v54OpenSessionBase(id,topup);
  planView=keepView;
  requestAnimationFrame(()=>{
    const h=document.getElementById("sessionHeading");
    if(h) h.focus({preventScroll:true});
    else document.activeElement?.blur?.();
  });
};
