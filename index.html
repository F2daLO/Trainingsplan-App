<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Mein Trainingsplan</title>
  <style>
:root{
  --bg:#f2f2f7;--card:#ffffff;--text:#111114;--secondary:#6e6e73;
  --line:#d1d1d6;--blue:#007aff;--green:#34c759;--red:#ff3b30;
  --yellow:#ffcc00;--gold:#d9a300;--goldbg:#fff8d8;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.app{min-height:100vh;padding-bottom:94px}
.topbar{
  position:sticky;top:0;z-index:20;
  background:rgba(249,249,249,.94);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid rgba(60,60,67,.18);
  padding:calc(8px + env(safe-area-inset-top)) 16px 10px
}
.topbar h1{font-size:17px;text-align:center;margin:0 0 9px;font-weight:700}
.topbar select{
  width:100%;border:0;background:rgba(118,118,128,.12);
  border-radius:10px;padding:9px 12px;color:var(--text);outline:0
}
main{padding:16px 16px 30px;max-width:760px;margin:auto}
.screen-title{
  font-size:34px;line-height:1.08;font-weight:700;letter-spacing:-.7px;margin:5px 0 17px
}
.stats{
  display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);
  border-radius:15px;overflow:hidden;margin-bottom:17px
}
.stat{background:#fff;padding:13px 7px;text-align:center}
.stat b{font-size:22px;display:block;line-height:1.1}
.stat span{font-size:11px;color:var(--secondary)}
.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}
.toolbar button{
  border:0;border-radius:12px;background:#fff;padding:12px;color:var(--blue);
  font-weight:600;box-shadow:0 1px 2px #0001
}
.toolbar .primary{background:var(--blue);color:#fff}
.toolbar .soft{background:var(--goldbg);color:#8a6500}
.toolbar button.utility{background:transparent;box-shadow:none;color:var(--secondary);font-weight:500;font-size:13px}
.viewbar{
  display:flex;background:rgba(118,118,128,.12);padding:2px;border-radius:9px;margin:10px 0 16px
}
.viewbar button{
  flex:1;border:0;background:transparent;border-radius:7px;padding:7px;
  font-size:13px;color:var(--secondary)
}
.viewbar button.active{background:#fff;color:var(--text);box-shadow:0 1px 3px #0002}
.legend{display:none}
.week{
  font-size:13px;font-weight:650;color:var(--secondary);text-transform:uppercase;
  letter-spacing:.25px;margin:21px 4px 8px
}
.session{
  position:relative;background:#fff;border:0;border-radius:16px;
  padding:14px 14px 11px 18px;margin:8px 0;
  box-shadow:0 1px 3px #0000000b;overflow:hidden
}
.session:before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:#c7c7cc
}
.session.done:before{background:var(--green)}
.session.cancel:before{background:var(--red)}
.session.move:before{background:var(--yellow)}
.session.topup{
  background:linear-gradient(180deg,#fffef7,#fff);
  box-shadow:0 0 0 1.5px var(--gold),0 3px 10px rgba(217,163,0,.13)
}
.session.topup:before{background:var(--gold)}
.topup-badge{
  display:inline-block;margin:0 0 7px;background:var(--goldbg);color:#795900;
  border:1px solid #efd979;border-radius:8px;padding:3px 7px;
  font-size:10px;font-weight:800;letter-spacing:.15px
}
.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.title{font-weight:650;font-size:16px}
.date{color:var(--secondary);font-size:13px;white-space:nowrap}
.meta{font-size:13px;color:var(--secondary);margin-top:5px;line-height:1.35}
.note{background:#f2f2f7;border-radius:10px;padding:9px;margin-top:9px;font-size:13px;white-space:pre-wrap}
.actions{
  display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;border-top:1px solid #eeeef2;padding-top:9px
}
.actions button{border:0;background:transparent;color:var(--blue);font-size:12px;padding:3px 1px}
.actions .donebtn{color:var(--green)}
.actions .movebtn{color:#a57b00}
.actions .cancelbtn{color:var(--red)}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.day{
  min-height:78px;background:#fff;border-radius:11px;padding:7px;
  box-shadow:0 1px 2px #0001
}
.day.today{outline:2px solid var(--blue)}
.daynum{font-size:12px;font-weight:650}
.dayitem{
  margin-top:5px;border-radius:7px;padding:4px;font-size:10px;line-height:1.1;
  background:#f2f2f7;overflow:hidden
}
.dayitem.done{background:#dff7e5}
.dayitem.cancel{background:#ffe2df}
.dayitem.move{background:#fff3c4}
.dayitem.topup{background:var(--goldbg);box-shadow:inset 0 0 0 1px #efd979}
.bottomnav{
  position:fixed;z-index:30;left:0;right:0;bottom:0;
  padding:7px 10px calc(7px + env(safe-area-inset-bottom));
  background:rgba(249,249,249,.95);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid rgba(60,60,67,.18);
  display:grid;grid-template-columns:repeat(4,1fr);text-align:center
}
.navitem{border:0;background:transparent;color:var(--secondary);font-size:10px;padding:2px}
.navitem.active{color:var(--blue)}
.navicon{font-size:21px;line-height:22px;display:block;margin-bottom:2px}
dialog{
  border:0;border-radius:20px;padding:0;width:min(94vw,620px);
  box-shadow:0 25px 70px #0005
}
dialog::backdrop{background:#0006;backdrop-filter:blur(3px)}
.modal{padding:20px}
.modal h2{font-size:22px;margin:0 0 18px}
.modal p.helper{font-size:13px;color:var(--secondary);line-height:1.45;margin-top:-8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.full{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--secondary)}
label input,label textarea,label select{
  border:1px solid var(--line);border-radius:11px;padding:10px;background:#f9f9fb;color:var(--text);outline:0
}
.inline-check{
  display:flex;flex-direction:row;align-items:center;gap:9px;
  background:var(--goldbg);border:1px solid #efd979;border-radius:11px;padding:10px;color:#795900
}
.inline-check input{width:18px;height:18px;margin:0}
.modal .buttons{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.modal .buttons button{border:0;border-radius:11px;padding:10px 14px}
.modal .buttons .primary{background:var(--blue);color:#fff}
.settings-card{background:#fff;border-radius:15px;padding:15px;margin:10px 0}
.settings-card h3{margin:0 0 5px;font-size:17px}
.settings-card p{color:var(--secondary);font-size:13px;line-height:1.4}
.settings-card button{border:0;border-radius:11px;background:var(--blue);color:#fff;padding:10px 14px}
.statusline{font-size:12px;margin-top:8px;color:var(--secondary)}
@media(max-width:520px){
  .grid{grid-template-columns:1fr}.full{grid-column:auto}
  .calendar{gap:3px}.day{min-height:68px;padding:5px}.dayitem{font-size:9px}
}

/* ===== V4.2 Responsive UI ===== */

/* iOS Safari zooms focused inputs below 16px. Keep form controls >=16px. */
input, select, textarea,
label input, label select, label textarea {
  font-size:16px !important;
}

/* Prevent accidental text autosizing / horizontal layout drift. */
html {
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
}
body {
  overflow-x:hidden;
}
img, svg {
  max-width:100%;
}
main, .app, .topbar, .bottomnav, dialog, .modal {
  max-width:100%;
}
dialog {
  max-height:88dvh;
}
.modal {
  max-height:88dvh;
  overflow:auto;
  -webkit-overflow-scrolling:touch;
}

/* Mobile / iPhone */
@media (max-width: 767px) {
  .app {
    padding-bottom:94px;
  }
  main {
    width:100%;
    padding-left:14px;
    padding-right:14px;
  }
  .screen-title {
    font-size:32px;
  }
  .toolbar {
    grid-template-columns:1fr 1fr;
  }
  .stats {
    grid-template-columns:repeat(3,minmax(0,1fr));
  }
  .calendar {
    grid-template-columns:repeat(7,minmax(0,1fr));
  }
  .day {
    min-width:0;
  }
  .dayitem {
    word-break:break-word;
  }
}

/* iPad / tablet: keep bottom navigation, give content more breathing room. */
@media (min-width:768px) and (max-width:1199px) {
  .app {
    padding-bottom:96px;
  }
  main {
    width:min(100%, 980px);
    padding:24px 28px 36px;
  }
  .topbar {
    padding-left:28px;
    padding-right:28px;
  }
  .toolbar {
    grid-template-columns:repeat(3,1fr);
  }
  .screen-title {
    font-size:38px;
  }
  .calendar {
    gap:8px;
  }
  .day {
    min-height:96px;
  }
}

/* Desktop: permanent left sidebar, no bottom bar. */
@media (min-width:1200px) {
  body {
    background:#f2f2f7;
  }

  .app {
    padding-bottom:0;
    padding-left:220px;
  }

  .topbar {
    left:220px;
    width:calc(100% - 220px);
    padding-left:34px;
    padding-right:34px;
  }

  .topbar h1 {
    text-align:left;
    font-size:15px;
    color:#6e6e73;
    margin-bottom:8px;
  }

  .topbar select {
    width:min(420px,100%);
  }

  main {
    max-width:1280px;
    margin:0 auto;
    padding:30px 40px 48px;
  }

  .screen-title {
    font-size:42px;
    margin-bottom:22px;
  }

  .bottomnav.appnav {
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    right:auto;
    width:220px;
    height:100dvh;
    padding:28px 16px;
    display:flex;
    flex-direction:column;
    align-items:stretch;
    justify-content:flex-start;
    gap:8px;
    text-align:left;
    background:rgba(249,249,249,.96);
    border-top:0;
    border-right:1px solid rgba(60,60,67,.18);
    box-shadow:1px 0 0 rgba(255,255,255,.6);
    z-index:40;
  }

  .bottomnav.appnav::before {
    content:"Mein Training";
    display:block;
    font-size:20px;
    font-weight:700;
    letter-spacing:-.25px;
    padding:6px 10px 20px;
    color:#111114;
  }

  .navitem {
    display:flex;
    align-items:center;
    gap:12px;
    width:100%;
    text-align:left;
    font-size:15px;
    line-height:1;
    padding:12px 14px;
    border-radius:11px;
  }

  .navitem:hover {
    background:rgba(118,118,128,.08);
  }

  .navitem.active {
    background:rgba(0,122,255,.10);
    color:#007aff;
    font-weight:650;
  }

  .navicon {
    width:24px;
    margin:0;
    font-size:20px;
    line-height:20px;
    text-align:center;
  }

  .stats {
    grid-template-columns:repeat(3,minmax(160px,1fr));
  }

  .toolbar {
    display:flex;
    flex-wrap:wrap;
  }

  .toolbar button {
    min-width:150px;
  }

  .viewbar {
    width:320px;
  }

  .calendar {
    gap:10px;
  }

  .day {
    min-height:118px;
    padding:10px;
  }

  .daynum {
    font-size:13px;
  }

  .dayitem {
    font-size:11px;
    padding:6px;
  }

  dialog {
    width:min(680px,calc(100vw - 280px));
  }
}

/* Very wide desktop: center content without stretching cards excessively. */
@media (min-width:1600px) {
  main {
    max-width:1400px;
  }
}


/* ===== V4.3 Apple Glass-inspired visual layer ===== */
:root{
  --glass-bg:rgba(255,255,255,.58);
  --glass-bg-strong:rgba(255,255,255,.72);
  --glass-border:rgba(255,255,255,.56);
  --glass-shadow:0 10px 30px rgba(31,38,52,.10),0 2px 8px rgba(31,38,52,.06);
  --glass-shadow-soft:0 4px 14px rgba(31,38,52,.07);
  --glass-highlight:inset 0 1px 0 rgba(255,255,255,.72);
}
body{
  background:
    radial-gradient(circle at 12% 10%, rgba(0,122,255,.08), transparent 28%),
    radial-gradient(circle at 88% 16%, rgba(90,200,250,.10), transparent 24%),
    linear-gradient(180deg,#f5f7fb 0%,#eef1f6 100%);
  background-attachment:fixed;
}
.topbar{
  background:rgba(246,248,252,.62) !important;
  border-bottom:1px solid rgba(255,255,255,.65) !important;
  box-shadow:0 8px 24px rgba(31,38,52,.05);
  backdrop-filter:saturate(180%) blur(28px) !important;
  -webkit-backdrop-filter:saturate(180%) blur(28px) !important;
}
.topbar select{
  background:rgba(255,255,255,.54) !important;
  border:1px solid rgba(255,255,255,.65) !important;
  box-shadow:var(--glass-highlight),0 3px 12px rgba(31,38,52,.05);
}
.stats{background:transparent !important;gap:10px !important;overflow:visible !important}
.stat{
  border-radius:18px;background:var(--glass-bg) !important;border:1px solid var(--glass-border);
  box-shadow:var(--glass-shadow-soft),var(--glass-highlight);
  backdrop-filter:blur(24px) saturate(160%);
  -webkit-backdrop-filter:blur(24px) saturate(160%);
}
.toolbar button{
  border:1px solid var(--glass-border) !important;background:var(--glass-bg) !important;
  box-shadow:var(--glass-shadow-soft),var(--glass-highlight) !important;
  backdrop-filter:blur(22px) saturate(160%);
  -webkit-backdrop-filter:blur(22px) saturate(160%);
  transition:transform .16s ease,box-shadow .16s ease,background .16s ease;
}
.toolbar button:active{transform:scale(.985)}
.toolbar .primary{
  background:linear-gradient(180deg,rgba(20,132,255,.96),rgba(0,122,255,.94)) !important;
  color:white !important;border-color:rgba(255,255,255,.22) !important;
  box-shadow:0 8px 18px rgba(0,122,255,.22),inset 0 1px 0 rgba(255,255,255,.28) !important;
}
.toolbar .soft{
  background:linear-gradient(180deg,rgba(255,246,196,.90),rgba(255,236,149,.84)) !important;
  border-color:rgba(255,255,255,.55) !important;
}
.toolbar .utility{background:rgba(255,255,255,.34) !important}
.viewbar{
  background:rgba(118,118,128,.12) !important;border:1px solid rgba(255,255,255,.55);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
}
.viewbar button.active{
  background:rgba(255,255,255,.82) !important;
  box-shadow:0 2px 10px rgba(31,38,52,.08),inset 0 1px 0 rgba(255,255,255,.9) !important;
}
.session{
  background:var(--glass-bg-strong) !important;border:1px solid var(--glass-border) !important;
  box-shadow:var(--glass-shadow),var(--glass-highlight) !important;
  backdrop-filter:blur(26px) saturate(165%);
  -webkit-backdrop-filter:blur(26px) saturate(165%);
}
.session.topup{
  background:linear-gradient(180deg,rgba(255,253,240,.86),rgba(255,250,224,.72)) !important;
  box-shadow:0 0 0 1px rgba(217,163,0,.35),0 10px 28px rgba(128,93,0,.10),var(--glass-highlight) !important;
}
.note{
  background:rgba(242,242,247,.62) !important;border:1px solid rgba(255,255,255,.55);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
.day{
  background:var(--glass-bg) !important;border:1px solid var(--glass-border);
  box-shadow:var(--glass-shadow-soft),var(--glass-highlight) !important;
  backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);
}
.day.today{
  outline:2px solid rgba(0,122,255,.78) !important;
  box-shadow:0 0 0 5px rgba(0,122,255,.08),var(--glass-shadow-soft) !important;
}
.bottomnav.appnav{
  background:rgba(247,248,251,.64) !important;border-top:1px solid rgba(255,255,255,.65) !important;
  box-shadow:0 -8px 24px rgba(31,38,52,.06);
  backdrop-filter:saturate(180%) blur(28px) !important;
  -webkit-backdrop-filter:saturate(180%) blur(28px) !important;
}
.settings-card{
  background:var(--glass-bg) !important;border:1px solid var(--glass-border);
  box-shadow:var(--glass-shadow-soft),var(--glass-highlight);
  backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);
}
dialog{background:transparent !important;box-shadow:none !important}
dialog::backdrop{
  background:rgba(20,24,32,.28) !important;
  backdrop-filter:blur(14px) saturate(120%) !important;
  -webkit-backdrop-filter:blur(14px) saturate(120%) !important;
}
.modal{
  background:rgba(249,250,253,.80);border:1px solid rgba(255,255,255,.68);border-radius:24px;
  box-shadow:0 24px 60px rgba(31,38,52,.22),inset 0 1px 0 rgba(255,255,255,.82);
  backdrop-filter:blur(32px) saturate(170%);-webkit-backdrop-filter:blur(32px) saturate(170%);
}
label input,label textarea,label select{
  background:rgba(255,255,255,.66) !important;border:1px solid rgba(255,255,255,.74) !important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 2px 8px rgba(31,38,52,.04);
}
@media (min-width:1200px){
  .bottomnav.appnav{
    background:rgba(247,248,251,.70) !important;
    border-right:1px solid rgba(255,255,255,.72) !important;
    box-shadow:8px 0 28px rgba(31,38,52,.06) !important;
  }
  .navitem{border:1px solid transparent}
  .navitem:hover{
    background:rgba(255,255,255,.48) !important;
    border-color:rgba(255,255,255,.58);
  }
  .navitem.active{
    background:rgba(255,255,255,.72) !important;border-color:rgba(255,255,255,.72);
    box-shadow:0 3px 12px rgba(31,38,52,.06),inset 0 1px 0 rgba(255,255,255,.86);
  }
}
@media (prefers-reduced-transparency: reduce){
  .topbar,.session,.stat,.day,.settings-card,.bottomnav.appnav,.modal,.toolbar button{
    backdrop-filter:none !important;-webkit-backdrop-filter:none !important;background:#fff !important;
  }
}

</style>
</head>
<body>
<header>
  <h1>🚴 Mein Trainingsplan</h1>
  <select id="planSelect"></select>
</header>
<main>
  <div class="screen-title">Übersicht</div>
<div id="globalCloudStatus" style="margin:-8px 0 14px;font-size:12px;color:#6e6e73;white-space:normal;overflow-wrap:anywhere">
  ☁️ Cloud wird geprüft …
</div><div class="stats" id="stats"></div>
  <div class="toolbar">
    <button class="primary" onclick="openSession()">＋ Training</button>
    <button class="soft" onclick="openSession(null,true)">⭐ On Top</button>
    <button onclick="openPlan()">＋ Trainingsplan</button>
    <button class="utility" onclick="exportData()">⇩ Backup</button>
    <button class="utility" onclick="document.getElementById('importFile').click()">⇧ Import</button>
    <input id="importFile" type="file" accept=".json" hidden onchange="importData(event)">
  </div>
  <div class="viewbar">
    <button id="listViewBtn" class="active" onclick="setView('list')">Liste</button>
    <button id="weekViewBtn" onclick="setView('week')">Woche</button>
  </div>
  <div class="legend">
    <span><i class="dot g"></i>durchgeführt</span>
    <span><i class="dot r"></i>abgesagt/nicht durchgeführt</span>
    <span><i class="dot y"></i>verschoben</span>
    <span><i class="dot n"></i>offen</span>
  </div>
  <div id="list"></div>
</main>

<dialog id="sessionDialog">
  <form method="dialog" class="modal" onsubmit="saveSession(event)">
    <h2 id="sessionHeading">Training</h2>
    <div class="grid">
      <label>Datum<input id="sDate" type="date" required></label>
      <label>Trainingsart<input id="sType" list="types" placeholder="z. B. Indoor, Outdoor, Kraft"></label>
      <label class="full">Titel<input id="sTitle" required placeholder="z. B. Grundlagenausdauer"></label>
      <label class="full">Beschreibung<textarea id="sDesc" rows="3" placeholder="Dauer, Intensität, Ziel, Vorgaben …"></textarea></label>
      <label>Plan<input id="sPlan" type="text" readonly></label>
      <label>Status<select id="sStatus"><option value="open">Offen</option><option value="done">Durchgeführt</option><option value="cancel">Abgesagt / nicht durchgeführt</option><option value="move">Verschoben</option></select></label>
      <label class="full inline-check">
        <input id="sTopup" type="checkbox">
        <span>⭐ Zusatztraining „On Top“ innerhalb dieses Plans</span>
      </label>
      <label class="full">Meine Anmerkung<textarea id="sNote" rows="3" placeholder="Wie war es? Leistung, Puls, Beine, Probleme …"></textarea></label>
      <label>Erinnerung<select id="sReminder">
        <option value="both">Vortag + Trainingstag</option>
        <option value="day">Nur Trainingstag</option>
        <option value="before">Nur Vortag</option>
        <option value="none">Keine</option>
      </select></label>
      <label>Uhrzeit<input id="sReminderTime" type="time" value="19:00"></label>
    </div>
    <div class="buttons"><button type="button" onclick="sessionDialog.close()">Abbrechen</button><button class="primary">Speichern</button></div>
  </form>
</dialog>

<dialog id="planDialog">

function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function render(){
  const ps=document.getElementById("planSelect");
  ps.innerHTML=db.plans.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("");
  ps.value=db.activePlan; ps.onchange=()=>{db.activePlan=ps.value;save()};
  const arr=db.sessions.filter(s=>s.planId===db.activePlan).sort((a,b)=>a.date.localeCompare(b.date));
  const done=arr.filter(s=>s.status==="done").length, cancel=arr.filter(s=>s.status==="cancel").length;
  document.getElementById("stats").innerHTML=`<div class="stat"><b>${arr.length}</b>Trainings</div><div class="stat"><b>${done}</b>erledigt</div><div class="stat"><b>${cancel}</b>ausgefallen</div>`;
  const list=document.getElementById("list");
  if(!arr.length){list.innerHTML='<div class="empty">Noch keine Trainings in diesem Plan.<br>Über „＋ Training“ kannst du sie anlegen.</div>';return}
  const groups={};
  arr.forEach(s=>{const d=new Date(s.date+"T12:00:00"), key=`KW ${isoWeek(d)} · ${d.toLocaleDateString("de-DE",{month:"long",year:"numeric"})}`;(groups[key]??=[]).push(s)});
  list.innerHTML=Object.entries(groups).map(([w,items])=>`<div class="week">${w}</div>`+items.map(card).join("")).join("");
}
function card(s){
  const d=new Date(s.date+"T12:00:00");
  return `<div class="session ${s.status} ${s.topup?"topup":""}">${s.topup?'<div class="topup-badge">⭐ ON TOP · ZUSATZTRAINING</div>':""}
    <div class="top"><div class="title">${esc(s.title)}</div><div class="date">${d.toLocaleDateString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit"})}</div></div>
    <div class="meta">${esc(s.type||"")} ${s.desc?"· "+esc(s.desc):""}</div>
    ${s.note?`<div class="note">📝 ${esc(s.note)}</div>`:""}
    <div class="actions">
      <button onclick="status('${s.id}','done')">🟢 Erledigt</button>
      <button onclick="status('${s.id}','move')">🟡 Verschoben</button>
      <button onclick="status('${s.id}','cancel')">🔴 Ausgefallen</button>
      <button onclick="status('${s.id}','open')">⚪ Offen</button>
      <button onclick="openSession('${s.id}')">Details</button><button onclick="moveSession('${s.id}',1)">↪ Morgen</button>
    </div>
  </div>`;
}
function status(id,st){const s=db.sessions.find(x=>x.id===id);s.status=st;save();}
function openSession(id=null){
  editId=id; const s=id?db.sessions.find(x=>x.id===id):null;
  document.getElementById("sessionHeading").textContent=s?"Training bearbeiten":"Training hinzufügen";
  sDate.value=s?.date||new Date().toISOString().slice(0,10); sType.value=s?.type||"";
  sTitle.value=s?.title||""; sDesc.value=s?.desc||""; sNote.value=s?.note||"";
  sStatus.value=s?.status||"open"; sPlan.value=db.plans.find(p=>p.id===db.activePlan)?.name||"";
  sessionDialog.showModal();
}
function saveSession(e){
  e.preventDefault();
  const obj={id:editId||crypto.randomUUID(),planId:db.activePlan,date:sDate.value,type:sType.value,title:sTitle.value,desc:sDesc.value,note:sNote.value,status:sStatus.value};
  const i=db.sessions.findIndex(x=>x.id===obj.id); if(i>=0) db.sessions[i]=obj; else db.sessions.push(obj);
  sessionDialog.close();save();
}
function openPlan(){pName.value="";pDesc.value="";planDialog.showModal();}
function savePlan(e){
  e.preventDefault(); const p={id:crypto.randomUUID(),name:pName.value,description:pDesc.value};
  db.plans.push(p);db.activePlan=p.id;planDialog.close();save();
}
function exportData(){
  const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"}),a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download="trainingsplan-backup.json";a.click();URL.revokeObjectURL(a.href);
}
function importData(e){
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.plans||!x.sessions)throw 0;db=x;save();alert("Backup importiert.");}catch{alert("Ungültige Backup-Datei.");}};
  r.readAsText(f);e.target.value="";
}
function isoWeek(d){const x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=x.getUTCDay()||7;x.setUTCDate(x.getUTCDate()+4-day);const y=new Date(Date.UTC(x.getUTCFullYear(),0,1));return Math.ceil((((x-y)/86400000)+1)/7)}

function renderWeek(){
  const arr=db.sessions.filter(s=>s.planId===db.activePlan).sort((a,b)=>a.date.localeCompare(b.date));
  const byWeek={};
  arr.forEach(s=>{
    const d=new Date(s.date+'T12:00:00');
    const day=(d.getDay()+6)%7;
    const monday=new Date(d); monday.setDate(d.getDate()-day);
    const key=monday.toISOString().slice(0,10);
    (byWeek[key]??=[]).push(s);
  });
  const list=document.getElementById('list');
  if(!arr.length){list.innerHTML='<div class="empty">Noch keine Trainings in diesem Plan.</div>';return}
  list.innerHTML=Object.keys(byWeek).sort().map(k=>{
    const monday=new Date(k+'T12:00:00');
    let days='';
    for(let i=0;i<7;i++){
      const d=new Date(monday); d.setDate(monday.getDate()+i);
      const ds=d.toISOString().slice(0,10);
      const items=byWeek[k].filter(x=>x.date===ds);
      days += `<div class="day ${ds===new Date().toISOString().slice(0,10)?'today':''}">

      </div>`;
    }
    return `<div class="week">Woche ab ${monday.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'})}</div><div class="calendar">${days}</div>`;
  }).join('');
}

async function syncCloud(showResult=false){
  if(syncInProgress || !sbClient || !cloudUser) return;
  syncInProgress=true;
  try{
    migrateLegacyPlanIdsForUser();
    normalizeLocalData();

    const [plansRes,sessionsRes] = await Promise.all([
      sbClient.from("training_plans").select("*"),
      sbClient.from("training_sessions").select("*")
    ]);
    if(plansRes.error) throw plansRes.error;
    if(sessionsRes.error) throw sessionsRes.error;

    const remotePlans=plansRes.data||[];
    const remoteSessions=sessionsRes.data||[];
    const remotePlanMap=new Map(remotePlans.map(x=>[x.id,x]));
    const remoteSessionMap=new Map(remoteSessions.map(x=>[x.id,x]));

    // Plans: IDs are stable. Add cloud-only plans locally; upload local/new plans.
    remotePlans.forEach(r=>{
      if(!db.plans.some(p=>p.id===r.id)) db.plans.push(remoteToPlan(r));
    });
    const planRows=db.plans.map(planToRemote);
    if(planRows.length){
      const {error}=await sbClient.from("training_plans").upsert(planRows,{onConflict:"id"});
      if(error) throw error;
    }

    // Sessions: newest updated_at wins. Local-only rows are uploaded.
    const pushSessions=[];
    remoteSessions.forEach(r=>{
      const i=db.sessions.findIndex(s=>s.id===r.id);
      if(i<0){
        db.sessions.push(remoteToSession(r));
      } else {
        const local=db.sessions[i];
        const lt=Date.parse(local.updatedAt||legacyTime());
        const rt=Date.parse(r.updated_at||legacyTime());
        if(rt>lt){
          db.sessions[i]=remoteToSession(r);
        } else if(lt>rt){
          pushSessions.push(local);
        }
      }
    });
    db.sessions.forEach(s=>{
      if(!remoteSessionMap.has(s.id)) pushSessions.push(s);
    });

    // Remove duplicate push IDs if a row was selected twice.
    const uniquePush=[...new Map(pushSessions.map(s=>[s.id,s])).values()];
    if(uniquePush.length){
      const {error}=await sbClient.from("training_sessions").upsert(uniquePush.map(sessionToRemote),{onConflict:"id"});
      if(error) throw error;
    }

    if(!db.plans.some(p=>p.id===db.activePlan) && db.plans.length) db.activePlan=db.plans[0].id;
    localStorage.setItem(KEY,JSON.stringify(db));
    lastSyncAt=isoNow();
    localStorage.setItem("training_last_sync",lastSyncAt);
    render();

    if(showResult) alert(`Cloud-Sync abgeschlossen.\n${db.plans.length} Plan/Pläne · ${db.sessions.length} Einheiten`);
  }catch(err){
    console.error("Cloud-Sync fehlgeschlagen:",err);
    if(showResult) alert("Cloud-Sync fehlgeschlagen: "+(err?.message||err));
  }finally{
    syncInProgress=false;
    const status=document.getElementById("cloudStatus");
    if(status) status.textContent=cloudStatusText();
  }
}

let v41Online = navigator.onLine;
let v41SyncRunning = false;
let v41SyncQueued = false;
let v41LastSync = localStorage.getItem("training_last_sync") || "";
let v41LastSyncError = "";

function v41SetCloudStatus(text, kind="normal"){
  const el=document.getElementById("globalCloudStatus");
  if(!el) return;
  const prefix = kind==="ok" ? "☁️ " : kind==="offline" ? "⚠️ " : kind==="error" ? "❗ " : "☁️ ";
  el.textContent = prefix + text;
  el.style.color = kind==="ok" ? "#248a3d" : kind==="offline" ? "#a06b00" : kind==="error" ? "#c62828" : "#6e6e73";
}

function v41StatusText(){
  if(!navigator.onLine) return {text:"Offline · lokale Änderungen werden später synchronisiert",kind:"offline"};
  if(v41SyncRunning) return {text:"Synchronisierung läuft …",kind:"normal"};
  if(typeof cloudUser!=="undefined" && cloudUser){
    if(v41LastSync){
      return {text:"Synchronisiert · "+new Date(v41LastSync).toLocaleString("de-DE"),kind:"ok"};
    }
    return {text:"Cloud verbunden",kind:"ok"};
  }
  return {text:"Nicht angemeldet",kind:"normal"};
}

function v41RefreshStatus(){
  const s=v41StatusText();
  v41SetCloudStatus(s.text,s.kind);
  const settingsStatus=document.getElementById("cloudStatus");
  if(settingsStatus){
    settingsStatus.textContent=s.text;
  }
}

async function v41AutoSync(reason="auto"){
  if(!navigator.onLine){
    v41RefreshStatus();
    return;
  }
  if(typeof sbClient==="undefined" || !sbClient || typeof cloudUser==="undefined" || !cloudUser){
    v41RefreshStatus();
    return;
  }
  if(v41SyncRunning){
    v41SyncQueued=true;
    return;
  }

  v41SyncRunning=true;
  v41LastSyncError="";
  v41RefreshStatus();

  try{
    if(typeof syncCloud==="function"){
      await syncCloud(false);
    }
    v41LastSync=localStorage.getItem("training_last_sync") || new Date().toISOString();
    localStorage.setItem("training_last_sync",v41LastSync);
  }catch(err){
    v41LastSyncError=String(err?.message||err);
    console.error("V4.1 AutoSync:",err);
  }finally{
    v41SyncRunning=false;
    if(v41LastSyncError){
      v41SetCloudStatus("Sync fehlgeschlagen · lokale Daten bleiben erhalten","error");
    }else{
      v41RefreshStatus();
    }
    if(v41SyncQueued){
      v41SyncQueued=false;
      setTimeout(()=>v41AutoSync("queued"),300);
    }
  }
}

function v41QueueSync(){
  clearTimeout(window.__v41SyncTimer);
  window.__v41SyncTimer=setTimeout(()=>v41AutoSync("change"),900);
}
